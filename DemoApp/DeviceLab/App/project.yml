# 機種ごとの再現（DeviceLab）の macOS アプリの殻。xcodegen generate で DeviceLab.xcodeproj を作る（生成物は git の対象外）。
# 処理は ../（DeviceSimulation）、3D の描画は ../../Library（CourtSceneView）。動画は ../../videos から、アプリの中に入る。
name: DeviceLab
options:
  bundleIdPrefix: dev.akidon0000.samples
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5"
    GENERATE_INFOPLIST_FILE: YES
    # 手元で動かすだけなので、その場の署名（ad hoc）にする。
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
packages:
  DeviceLab:
    path: ..
  DemoLibrary:
    path: ../../Library
targets:
  DeviceLab:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: ../../videos
        optional: true
        buildPhase: resources
    dependencies:
      - package: DeviceLab
        product: DeviceSimulation
      - package: DemoLibrary
        product: CourtSceneView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.akidon0000.samples.DeviceLab
        INFOPLIST_KEY_CFBundleDisplayName: DeviceLab
